name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verificar secrets
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -z "$N8N_URL" ] || [ -z "$N8N_API_KEY" ]; then
            echo "::error::Faltan los secrets N8N_URL y/o N8N_API_KEY (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$N8N_URL" in https://*) ;; *) echo "::error::N8N_URL debe empezar con https://"; exit 1;; esac

      - name: Compilar
        env:
          N8N_URL: ${{ secrets.N8N_URL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "plc-reset-v${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: plc-reset-apk
          path: plc-reset-v${{ github.run_number }}.apk
          retention-days: 14
